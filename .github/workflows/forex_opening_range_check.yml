name: Forex Opening-Range Signature Screen (manual)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests pandas numpy
      - run: python forex_opening_range_lab.py
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
