name: Forex CROSS_RANGE_TOP20 Narrowed Portfolio (manual)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests pandas numpy
      - run: python forex_cross_range_top20_narrowed_lab.py
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
